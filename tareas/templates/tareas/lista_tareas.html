<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Agenda de tareas</title>
</head>
<body>
    <h1>Agenda de tareas</h1>

    {% if tareas %}
        <ul>
            {% for tarea in tareas %}
                <li>
                    <strong>{{ tarea.codigo }}</strong> - {{ tarea.titulo }}
                    {% if tarea.completada %}
                        (completada)
                    {% else %}
                        (pendiente)
                    {% endif %}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No hay tareas todavía.</p>
    {% endif %}
</body>
</html>
